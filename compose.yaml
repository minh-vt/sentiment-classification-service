# The delivered manifest selects model identity at build time, not runtime.
# SERVICE_IMAGE lets CI reuse the image that passed the standalone smoke.
services:
  service:
    build:
      context: .
    image: ${SERVICE_IMAGE:-sentiment-service:local}
    # Runtime policy defaults come from Settings inside the image; override a
    # value by adding an `environment:` entry here rather than copying defaults.
    # The container always listens on 8000; only the host port is configurable.
    ports:
      - "${HOST_PORT:-8000}:8000"

  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      service:
        condition: service_started
