name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
      - uses: extractions/setup-just@v3
        with:
          just-version: "1.59.0"
      - run: just setup
      - run: just check
      - name: No formatting drift
        run: test -z "$(git status --porcelain)"

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SERVICE_IMAGE: sentiment-service:ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: extractions/setup-just@v3
        with:
          just-version: "1.59.0"
      - run: just build "$SERVICE_IMAGE"
      - run: docker run -d --name service -p 8000:8000 "$SERVICE_IMAGE"
      - run: just smoke
      - run: docker rm -f service
      - run: just up --no-build
      - run: just smoke
      - run: just monitor
      - if: failure()
        run: |
          docker logs service 2>&1 || true
          docker compose logs
      - if: always()
        run: |
          docker rm -f service 2>/dev/null || true
          just down
